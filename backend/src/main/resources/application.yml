server:
  port: 8080
  address: ${SHUTTLE_BIND_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework
  max-http-request-header-size: 8KB
  tomcat:
    max-connections: ${SHUTTLE_TOMCAT_MAX_CONNECTIONS:200}
    accept-count: ${SHUTTLE_TOMCAT_ACCEPT_COUNT:100}
    threads:
      max: ${SHUTTLE_TOMCAT_MAX_THREADS:64}
      min-spare: ${SHUTTLE_TOMCAT_MIN_THREADS:8}
  servlet:
    context-path: /
    session:
      timeout: 8h
      cookie:
        name: ${SHUTTLE_SESSION_COOKIE_NAME:SHUTTLE_SESSION}
        http-only: true
        same-site: lax
        secure: ${SHUTTLE_SESSION_COOKIE_SECURE:false}

spring:
  datasource:
    url: ${SHUTTLE_DB_URL:jdbc:mysql://127.0.0.1:3306/shuttle_db?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SHUTTLE_DB_USER:shuttle_app}
    password: ${SHUTTLE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${SHUTTLE_DB_POOL_SIZE:16}
      minimum-idle: ${SHUTTLE_DB_MIN_IDLE:2}
      connection-timeout: 3000
  redis:
    host: ${SHUTTLE_REDIS_HOST:127.0.0.1}
    port: ${SHUTTLE_REDIS_PORT:6379}
    password: ${SHUTTLE_REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

shuttle:
  ai:
    service-url: ${SHUTTLE_AI_SERVICE_URL:http://127.0.0.1:8000}
    service-token: ${SHUTTLE_AI_SERVICE_TOKEN:}
    enabled: true
    timeout-ms: 3000
  eta:
    buffer-sec: 60
  dispatch:
    scan-interval-sec: 10
    max-wait-min: 15
  alert:
    yellow-threshold: 8
    orange-threshold: 15
    red-threshold: 25
  cors:
    allowed-origins: ${SHUTTLE_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  bootstrap-admin:
    username: ${SHUTTLE_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${SHUTTLE_BOOTSTRAP_ADMIN_PASSWORD:}
  rate-limit:
    auth-per-window: ${SHUTTLE_RATE_LIMIT_AUTH:10}
    auth-window-seconds: ${SHUTTLE_RATE_LIMIT_AUTH_WINDOW_SECONDS:900}
    passenger-writes-per-window: ${SHUTTLE_RATE_LIMIT_PASSENGER:20}
    write-window-seconds: ${SHUTTLE_RATE_LIMIT_WRITE_WINDOW_SECONDS:60}
  redis:
    event-stream-max-length: ${SHUTTLE_REDIS_EVENT_STREAM_MAX_LENGTH:10000}
