<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园摆渡车系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 32px;
      color: #1976d2;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .header p {
      font-size: 14px;
      color: #888;
    }
    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      width: 260px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }
    .card .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .card .title {
      font-size: 18px;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .card .desc {
      font-size: 13px;
      color: #888;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 24px;
      min-height: 42px;
    }
    .card .btn {
      background-color: #1976d2;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      padding: 10px 24px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    .card .btn:hover {
      background-color: #1565c0;
    }
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>校园摆渡车系统</h1>
      <p>请选择您的身份进入对应端</p>
    </div>
    <div class="cards">
      <div class="card" v-for="card in cards" :key="card.title">
        <div class="icon">{{ card.icon }}</div>
        <div class="title">{{ card.title }}</div>
        <div class="desc">{{ card.desc }}</div>
        <button class="btn" @click="goTo(card.url)">进入{{ card.title }}</button>
      </div>
    </div>
    <div class="footer">© 2026 校园摆渡车系统</div>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const cards = ref([
          { icon: '🧑', title: '乘客端', desc: '查询线路、扫码签到、查看车辆到站时间', url: 'passenger.html' },
          { icon: '🚗', title: '司机端', desc: '接单、到站打卡、查看候车乘客信息', url: 'driver.html' },
          { icon: '⚙️', title: '管理端', desc: '线路管理、车辆调度、数据统计监控', url: 'admin.html' }
        ]);
        const goTo = (url) => {
          window.location.href = url;
        };
        return { cards, goTo };
      }
    }).mount('#app');
  </script>
</body>
</html>
