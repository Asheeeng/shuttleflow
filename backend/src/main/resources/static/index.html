<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f1ed">
  <title>ShuttleFlow · 校园摆渡车智能调度系统</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="neo.css">
</head>
<body class="sf-portal-shell">
  <main class="sf-portal">
    <header class="sf-portal-head">
      <div>
        <a class="sf-brand" href="index.html" aria-label="ShuttleFlow 首页">
          <span class="sf-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 15.5h18l-2-6.2a2 2 0 0 0-1.9-1.4H6.9A2 2 0 0 0 5 9.3L3 15.5Z" stroke="currentColor" stroke-width="2.2"/><path d="M5 15.5v2.3h2v-2.3m10 0v2.3h2v-2.3M7 11h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/><circle cx="7.5" cy="15.5" r="1" fill="currentColor"/><circle cx="16.5" cy="15.5" r="1" fill="currentColor"/></svg></span>
          <span>ShuttleFlow</span>
        </a>
        <div class="sf-eyebrow" style="margin-top:24px">CAMPUS TRANSIT · SMART DISPATCH</div>
        <h1 class="sf-portal-title">让每一程<br>都有回应。</h1>
        <p class="sf-portal-subtitle">校园摆渡车智能动态调度系统</p>
      </div>
        <div class="sf-portal-note">选择你的工作入口<br>乘客可登录保存身份，也可游客使用</div>
    </header>

    <section class="sf-role-grid" aria-label="选择使用角色">
      <article class="sf-role-card">
        <div class="sf-role-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="9" r="5" stroke="currentColor" stroke-width="2.5"/><path d="M6 28c.7-6.2 4.2-9.5 10-9.5s9.3 3.3 10 9.5H6Z" stroke="currentColor" stroke-width="2.5"/><path d="M22.5 8.5 26 12l-4.5 4.5" stroke="#2563eb" stroke-width="2.5"/></svg></div>
        <div><h2>乘客端</h2><p>登录后管理乘车身份，也可游客查询线路、车辆到站及候车。</p></div>
        <a href="login.html?role=passenger"><span>乘客登录 / 注册</span><span aria-hidden="true">↗</span></a>
        <a class="sf-secondary-link" href="passenger.html?guest=1">游客快速访问</a>
      </article>
      <article class="sf-role-card">
        <div class="sf-role-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M4 20h24l-2.5-8a3 3 0 0 0-2.8-2H9.3a3 3 0 0 0-2.8 2L4 20Z" stroke="currentColor" stroke-width="2.5"/><path d="M6 20v4h3v-4m14 0v4h3v-4M9 14h14" stroke="currentColor" stroke-width="2.5"/><circle cx="10" cy="20" r="1.5" fill="currentColor"/><circle cx="22" cy="20" r="1.5" fill="currentColor"/></svg></div>
        <div><h2>司机工作台</h2><p>查看绑定车辆和调度任务，完成到站、下客及上客上报。</p></div>
        <a href="login.html?role=driver"><span>司机登录</span><span aria-hidden="true">↗</span></a>
      </article>
      <article class="sf-role-card">
        <div class="sf-role-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M16 4v4m0 16v4M4 16h4m16 0h4M7.5 7.5l2.8 2.8m11.4 11.4 2.8 2.8m0-17-2.8 2.8m-11.4 11.4-2.8 2.8" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="6.5" stroke="currentColor" stroke-width="2.5"/></svg></div>
        <div><h2>调度控制台</h2><p>监控站点需求、车辆状态与预警，安排和跟进调度任务。</p></div>
        <a href="login.html?role=admin"><span>管理员 / 调度员登录</span><span aria-hidden="true">↗</span></a>
      </article>
    </section>
    <footer class="sf-portal-foot"><span>SHUTTLEFLOW · CAMPUS MOBILITY</span><span>课设演示系统 · 请使用分配的工作账号</span></footer>
  </main>
</body>
</html>
