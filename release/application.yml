server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shuttle_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

shuttle:
  ai:
    service-url: http://localhost:8000
    enabled: true
    timeout-ms: 3000
  eta:
    buffer-sec: 60
  dispatch:
    scan-interval-sec: 10
    max-wait-min: 15
  alert:
    yellow-threshold: 8
    orange-threshold: 15
    red-threshold: 25