limit_req_zone $binary_remote_addr zone=shuttle_v13_edge:1m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=shuttle_v13_conn:1m;
map $http_upgrade $shuttle_v13_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name @DOMAIN@;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shuttle-v13-acme;
        try_files $uri =404;
    }
    location / { return 308 https://@DOMAIN@$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name @DOMAIN@;
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    auth_basic "ShuttleFlow V1.3";
    auth_basic_user_file /etc/shuttle-v13/htpasswd;
    limit_req zone=shuttle_v13_edge burst=30 nodelay;
    limit_conn shuttle_v13_conn 16;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/shuttle-v13-access.log;
    error_log /var/log/nginx/shuttle-v13-error.log warn;
    # Internal worker endpoints remain reachable only directly on the loopback listener.
    location ~ ^/api/admin/operation/(clock|fleet|ledger|cursors|release|clear-waiting)$ { return 404; }
    location = /api/admin/simulation/cusum/tick { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $shuttle_v13_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header X-Operation-Token "";
        proxy_set_header X-Shuttle-Service-Token "";
        proxy_read_timeout 75s;
    }
}
