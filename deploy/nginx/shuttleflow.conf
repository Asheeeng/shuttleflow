# 把 shuttle.example.edu 替换为真实域名，证书由 Certbot 创建后启用此配置。
server {
    listen 80;
    listen [::]:80;
    server_name shuttle.example.edu;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shuttle.example.edu;
    ssl_certificate /etc/letsencrypt/live/shuttle.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shuttle.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ShuttleTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;
    limit_req_status 429;
    limit_conn shuttle_conn 200;
    access_log /var/log/nginx/shuttleflow-access.log;
    error_log /var/log/nginx/shuttleflow-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location ~ ^/api/(passenger|driver|admin)/(login|register)$ {
        limit_req zone=shuttle_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/shuttleflow-proxy.conf;
    }
    location ~ ^/api/passenger/(checkin|cancel)$ {
        limit_req zone=shuttle_passenger burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/shuttleflow-proxy.conf;
    }
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/shuttleflow-proxy.conf;
    }
}
